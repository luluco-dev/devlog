<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under the Veil — DevLog</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="devlog-content.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #12101e;
      color: #c4b8e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ──────────────────────────────────── */
    #topbar {
      height: 52px;
      background: #1a1730;
      border-bottom: 1px solid #2d2650;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      flex-shrink: 0;
    }
    #topbar h1 { font-size: 15px; font-weight: 600; color: #e0d4f5; }
    #topbar .sub { font-size: 12px; color: #6b5f8a; }
    #topbar .spacer { flex: 1; }
    #refresh-btn {
      font-size: 12px;
      color: #b494f0;
      background: none;
      border: 1px solid #2d2650;
      border-radius: 6px;
      padding: 5px 12px;
      cursor: pointer;
      transition: background .15s;
    }
    #refresh-btn:hover { background: #1e1a33; }
    #status { font-size: 11px; color: #6b5f8a; }

    /* ── Main layout ──────────────────────────────── */
    #layout { display: flex; flex: 1; overflow: hidden; }

    /* Sidebar */
    #sidebar {
      width: 210px;
      flex-shrink: 0;
      background: #16132a;
      border-right: 1px solid #2d2650;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #sidebar-header {
      padding: 12px 14px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #6b5f8a;
      border-bottom: 1px solid #2d2650;
    }
    #date-list { overflow-y: auto; flex: 1; }
    .date-item {
      padding: 9px 14px;
      font-size: 13px;
      cursor: pointer;
      color: #8a7faa;
      border-left: 3px solid transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background .1s;
    }
    .date-item:hover  { background: #1e1a33; }
    .date-item.active { background: #9b72e815; border-left-color: #9b72e8; color: #b494f0; font-weight: 600; }
    .date-item .cnt   { font-size: 10px; color: #6b5f8a; background: #1e1a33; border-radius: 10px; padding: 1px 6px; }
    .date-item.active .cnt { background: #9b72e830; color: #b494f0; }

    /* Content */
    #content-area {
      flex: 1;
      overflow-y: auto;
      padding: 36px 52px;
    }
    #date-title {
      font-size: 22px;
      font-weight: 700;
      color: #e0d4f5;
      margin-bottom: 6px;
    }
    #date-sub { font-size: 13px; color: #6b5f8a; margin-bottom: 24px; }
    #date-divider { border: none; border-top: 1px solid #2d2650; margin-bottom: 28px; }

    /* Loading / empty */
    .center-msg {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      gap: 10px;
      color: #6b5f8a;
      font-size: 14px;
    }
    .center-msg .icon { font-size: 36px; }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #2d2650;
      border-top-color: #9b72e8;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Markdown */
    #rendered h3 {
      font-size: 16px; font-weight: 600; margin: 32px 0 12px;
      padding-left: 10px; border-left: 3px solid #9b72e8;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      color: #e0d4f5;
    }
    #rendered h4 { font-size: 14px; font-weight: 600; margin: 20px 0 8px; color: #8a7faa; }
    #rendered p  { font-size: 14px; line-height: 1.8; margin-bottom: 12px; }
    #rendered ul, #rendered ol { padding-left: 22px; margin-bottom: 12px; }
    #rendered li { font-size: 14px; line-height: 1.8; margin-bottom: 4px; }
    #rendered li > ul, #rendered li > ol { margin-top: 4px; margin-bottom: 4px; }
    #rendered code {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px; background: #1e1a33;
      border: 1px solid #2d2650; border-radius: 4px;
      padding: 1px 5px; color: #e8a04c;
    }
    #rendered pre {
      background: #0d0b18; border-radius: 6px;
      padding: 16px 18px; overflow-x: auto; margin-bottom: 16px;
      border: 1px solid #2d2650;
    }
    #rendered pre code { background: none; border: none; padding: 0; color: #c4b8e0; font-size: 12px; }
    #rendered strong { font-weight: 600; color: #e0d4f5; }
    #rendered hr { border: none; border-top: 1px solid #2d2650; margin: 24px 0; }
    #rendered table { border-collapse: collapse; width: 100%; margin-bottom: 16px; font-size: 13px; }
    #rendered th, #rendered td { border: 1px solid #2d2650; padding: 8px 12px; text-align: left; }
    #rendered th { background: #1e1a33; font-weight: 600; color: #e0d4f5; }
    #rendered tr:nth-child(even) td { background: #16132a; }
    #rendered a { color: #b494f0; }
    #rendered img {
      display: block;
      max-width: 100%; border-radius: 8px; margin: 24px 0 8px;
      border: 1px solid #2d2650; cursor: zoom-in;
      transition: box-shadow .15s;
    }
    #rendered img:hover { box-shadow: 0 4px 16px rgba(155, 114, 232, .2); }
    #rendered blockquote {
      border-left: 4px solid #2d2650; padding: 6px 14px;
      color: #6b5f8a; margin-bottom: 12px;
    }

    .img-caption {
      display: block; text-align: center; font-size: 12px;
      color: #6b5f8a; margin: 0 0 32px; font-style: italic;
    }
    #rendered figcaption {
      display: block; text-align: center; font-size: 12px;
      color: #8a7faa; margin: 6px 0 28px;
      padding: 4px 12px;
      border-left: 2px solid #2d2650;
      text-align: left;
      font-style: normal;
    }

    .sec-badge {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 10px; line-height: 1.6;
    }

    /* 라이트박스 */
    #lightbox {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.88); z-index: 1000;
      align-items: center; justify-content: center; cursor: zoom-out;
    }
    #lightbox.active { display: flex; }
    #lightbox img { max-width: 92%; max-height: 92vh; border-radius: 10px; }
    #lightbox-close {
      position: absolute; top: 16px; right: 20px; color: #fff;
      font-size: 28px; cursor: pointer; line-height: 1; opacity: .7;
    }
    #lightbox-close:hover { opacity: 1; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #12101e; }
    ::-webkit-scrollbar-thumb { background: #2d2650; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3d3570; }
  </style>
</head>
<body>

  <div id="topbar">
    <h1>Under the Veil</h1>
    <span class="sub">/ DevLog</span>
    <div class="spacer"></div>
    <span id="status"></span>
    <button id="refresh-btn" onclick="fetchDevLog()">↺ 새로고침</button>
  </div>

  <div id="lightbox">
    <span id="lightbox-close" onclick="closeLightbox()">✕</span>
    <img id="lb-img" src="" alt="">
  </div>

  <div id="layout">
    <div id="sidebar">
      <div id="sidebar-header">날짜</div>
      <div id="date-list"></div>
    </div>

    <div id="content-area">
      <div id="empty-msg" class="center-msg">
        <span class="icon">📋</span>
        날짜를 선택하세요
      </div>
      <div id="date-content" style="display:none;">
        <div id="date-title"></div>
        <div id="date-sub"></div>
        <hr id="date-divider">
        <div id="rendered"></div>
      </div>
    </div>
  </div>

<script>
  marked.setOptions({ breaks: true });

  let sections = {};
  let dates    = [];

  function fetchDevLog() {
    sections = parseDevLog(DEVLOG_MD);
    dates    = Object.keys(sections).sort((a, b) => b.localeCompare(a));
    buildSidebar();
    setStatus(`${dates.length}개 날짜`);
    if (dates.length) selectDate(dates[0]);
  }

  function parseDevLog(md) {
    const result = {};
    const lines  = md.split('\n');
    let cur = null, buf = [];

    for (const line of lines) {
      const m = line.match(/^## (\d{4}-\d{2}-\d{2})\s*$/);
      if (m) {
        if (cur) result[cur] = buf.join('\n').trim();
        cur = m[1]; buf = [];
      } else if (cur) {
        buf.push(line);
      }
    }
    if (cur) result[cur] = buf.join('\n').trim();
    return result;
  }

  function buildSidebar() {
    const list = document.getElementById('date-list');
    list.innerHTML = '';

    if (!dates.length) {
      list.innerHTML = '<div class="center-msg">항목 없음</div>';
      return;
    }

    for (const d of dates) {
      const cnt = (sections[d].match(/^###/gm) || []).length;
      const el  = document.createElement('div');
      el.className  = 'date-item';
      el.dataset.date = d;
      el.innerHTML  = `${fmtDate(d)}<span class="cnt">${cnt || ''}</span>`;
      el.addEventListener('click', () => selectDate(d));
      list.appendChild(el);
    }
  }

  function selectDate(date) {
    document.querySelectorAll('.date-item').forEach(el =>
      el.classList.toggle('active', el.dataset.date === date)
    );
    document.getElementById('empty-msg').style.display = 'none';
    document.getElementById('date-content').style.display = 'block';
    document.getElementById('date-title').textContent = fmtDateFull(date);
    document.getElementById('date-sub').textContent   = dayOfWeek(date);

    const cleaned = (sections[date] || '').replace(/^---\s*$/gm, '').trim();
    document.getElementById('rendered').innerHTML = marked.parse(cleaned);
    document.getElementById('content-area').scrollTop = 0;
    addCaptions();
    addSectionBadges();
  }

  function addCaptions() {
    document.querySelectorAll('#rendered img').forEach(img => {
      if (!img.alt) return;
      if (img.nextSibling?.classList?.contains('img-caption')) return;
      const cap = document.createElement('span');
      cap.className = 'img-caption';
      cap.textContent = img.alt;
      img.after(cap);
    });
  }

  const BADGE_MAP = [
    { keys: ['결정','확정'],       color:'#58a6ff', bg:'#58a6ff18' },
    { keys: ['탐구','비교','조사'], color:'#b494f0', bg:'#b494f018' },
    { keys: ['구현','신규','개발'], color:'#56d364', bg:'#56d36418' },
    { keys: ['수정','버그','Fix'],  color:'#f47067', bg:'#f4706718' },
    { keys: ['개선','리팩','최적'], color:'#e8a04c', bg:'#e8a04c18' },
    { keys: ['설계','아키','분리'], color:'#79c0ff', bg:'#79c0ff18' },
  ];
  function addSectionBadges() {
    document.querySelectorAll('#rendered h3').forEach(h3 => {
      if (h3.querySelector('.sec-badge')) return;
      const text = h3.textContent;
      for (const { keys, color, bg } of BADGE_MAP) {
        if (keys.some(k => text.includes(k))) {
          const badge = document.createElement('span');
          badge.className = 'sec-badge';
          badge.textContent = keys[0];
          badge.style.cssText = `color:${color};background:${bg};border:1px solid ${color}33;`;
          h3.prepend(badge);
          break;
        }
      }
    });
  }

  document.addEventListener('click', e => {
    if (e.target.tagName === 'IMG' && e.target.closest('#rendered')) {
      document.getElementById('lb-img').src = e.target.src;
      document.getElementById('lightbox').classList.add('active');
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
  });
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
  }

  function fmtDate(d) {
    const [y, m, day] = d.split('-');
    return `${y}.${m}.${day}`;
  }
  function fmtDateFull(d) {
    const [y, m, day] = d.split('-');
    const mn = ['','1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    return `${y}년 ${mn[+m]} ${+day}일`;
  }
  function dayOfWeek(d) {
    const days = ['일','월','화','수','목','금','토'];
    return days[new Date(d).getDay()] + '요일';
  }
  function setStatus(msg) {
    document.getElementById('status').textContent = msg;
  }

  fetchDevLog();
</script>
</body>
</html>
